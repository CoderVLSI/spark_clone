# Base application configuration (shared across boards).

# --- Core / runtime ---------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y

# Hard-FP: the DSP/FFT path is float-heavy on the Cortex-M33.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# --- DSP --------------------------------------------------------------------
# CMSIS-DSP provides arm_rfft_fast_f32 and the vector math used in dsp/ and ai/.
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y
CONFIG_CMSIS_DSP_STATISTICS=y

# --- Audio capture ----------------------------------------------------------
# Enabled per-backend in boards/*.conf as well, but declared here for defaults.
CONFIG_AUDIO=y

# --- AI noise reduction -----------------------------------------------------
# TF-Lite Micro is only linked when the model backend is enabled (Kconfig).
# See boards/*.conf and CONFIG_NOISE_REDUCTION_USE_MODEL.

# --- Bluetooth (LE peripheral) ----------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="DB01-HA"
CONFIG_BT_DEVICE_APPEARANCE=1088   # Generic Hearing Aid
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
