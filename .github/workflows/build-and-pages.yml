name: Build firmware and deploy flasher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio esptool
      - name: Build XIAO ESP32-C6 firmware
        working-directory: firmware
        run: pio run
      - name: Create merged web-flasher image
        working-directory: firmware
        shell: bash
        run: |
          ENV=.pio/build/seeed_xiao_esp32c6
          BOOTAPP=$(find ~/.platformio -name boot_app0.bin | head -1)
          test -f "$ENV/bootloader.bin"
          test -f "$ENV/partitions.bin"
          test -f "$ENV/firmware.bin"
          test -n "$BOOTAPP"
          esptool --chip esp32c6 merge-bin -o ../site/firmware/merged-firmware.bin \
            --flash-mode dio --flash-freq 80m --flash-size 4MB \
            0x0 "$ENV/bootloader.bin" \
            0x8000 "$ENV/partitions.bin" \
            0xe000 "$BOOTAPP" \
            0x10000 "$ENV/firmware.bin"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
