# Board-specific Kconfig for the nRF5340 application core.

# Microphone drivers — the DMIC/I2S driver is enabled to match the selected
# backend. Leaving both on is harmless; only the compiled backend is used.
CONFIG_AUDIO_DMIC=y
CONFIG_I2S=y

# Give the DSP task room for the FFT scratch buffers.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
